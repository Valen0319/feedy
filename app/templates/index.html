<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-label="Logo de Feedy">
          <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo de Feedy" class="brand-logo" />
        </div>
        <h1>Feedy</h1>
      </header>

      <main class="content">
        <section class="primary-actions">
          <button class="action-button action-button--light" data-modal-target="portion-modal" type="button">
            Configurar porcion
          </button>
          <button class="action-button action-button--light" data-modal-target="camera-modal" type="button">
            Ver camara en<br />tiempo real
          </button>
        </section>

        <section class="schedule-card">
          <h2>Horas configuradas</h2>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Porciones</th>
                  <th>Hora</th>
                  <th>Eliminar</th>
                </tr>
              </thead>
              <tbody id="schedule-table-body"></tbody>
            </table>
          </div>

          <button class="add-button" type="button" data-modal-target="schedule-modal">
            Agregar
          </button>
        </section>
      </main>

      <footer class="device-status" aria-live="polite">
        <span id="device-status-indicator" class="status-indicator status-indicator--online"></span>
        <span id="device-status-text">Dispositivo conectado</span>
      </footer>
    </div>

    <div class="modal-overlay hidden" id="portion-modal" aria-hidden="true">
      <div class="modal-card modal-card--medium" role="dialog" aria-modal="true" aria-labelledby="portion-title">
        <button class="close-button" type="button" data-close-modal="portion-modal" aria-label="Cerrar">
          ×
        </button>
        <h3 id="portion-title">Configurar porcion</h3>

        <label class="field-label" for="portion-time">Duración del giro</label>
        <div class="input-row">
          <input id="portion-time" name="portion-time" type="number" min="100" max="5000" step="50" value="1200" />
          <span>ms</span>
        </div>

        <div class="modal-actions">
          <button class="primary-button" type="button">Guardar</button>
          <button class="secondary-button" type="button" id="test-portion-button">Probar porcion</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay hidden" id="camera-modal" aria-hidden="true">
      <div class="modal-card modal-card--wide" role="dialog" aria-modal="true" aria-labelledby="camera-title">
        <button class="close-button close-button--top-right" type="button" data-close-modal="camera-modal" aria-label="Cerrar vista de cámara">
          ×
        </button>
        <h3 id="camera-title">Cámara en tiempo real</h3>
        <div class="camera-frame">
          <video id="camera-feed" autoplay muted playsinline></video>
          <div class="camera-placeholder">
            <span class="camera-pulse"></span>
            <span>Feed de cámara activo</span>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay hidden" id="schedule-modal" aria-hidden="true">
      <div class="modal-card modal-card--medium" role="dialog" aria-modal="true" aria-labelledby="schedule-title">
        <button class="close-button" type="button" data-close-modal="schedule-modal" aria-label="Cerrar">
          ×
        </button>
        <h3 id="schedule-title">Agregar horario</h3>

        <label class="field-label" for="schedule-portion">Porciones</label>
        <input id="schedule-portion" type="number" min="1" max="10" value="2" />

        <label class="field-label" for="schedule-hour">Hora</label>
        <div class="time-picker" aria-label="Selecciona la hora en formato de 24 horas">
          <select id="schedule-hour" aria-label="Hora">
            <option value="00">00</option>
            <option value="01">01</option>
            <option value="02">02</option>
            <option value="03">03</option>
            <option value="04">04</option>
            <option value="05">05</option>
            <option value="06">06</option>
            <option value="07">07</option>
            <option value="08">08</option>
            <option value="09">09</option>
            <option value="10" selected>10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
          </select>
          <span class="time-separator">:</span>
          <select id="schedule-minute" aria-label="Minutos">
            <option value="00" selected>00</option>
            <option value="01">01</option>
            <option value="02">02</option>
            <option value="03">03</option>
            <option value="04">04</option>
            <option value="05">05</option>
            <option value="06">06</option>
            <option value="07">07</option>
            <option value="08">08</option>
            <option value="09">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
            <option value="24">24</option>
            <option value="25">25</option>
            <option value="26">26</option>
            <option value="27">27</option>
            <option value="28">28</option>
            <option value="29">29</option>
            <option value="30">30</option>
            <option value="31">31</option>
            <option value="32">32</option>
            <option value="33">33</option>
            <option value="34">34</option>
            <option value="35">35</option>
            <option value="36">36</option>
            <option value="37">37</option>
            <option value="38">38</option>
            <option value="39">39</option>
            <option value="40">40</option>
            <option value="41">41</option>
            <option value="42">42</option>
            <option value="43">43</option>
            <option value="44">44</option>
            <option value="45">45</option>
            <option value="46">46</option>
            <option value="47">47</option>
            <option value="48">48</option>
            <option value="49">49</option>
            <option value="50">50</option>
            <option value="51">51</option>
            <option value="52">52</option>
            <option value="53">53</option>
            <option value="54">54</option>
            <option value="55">55</option>
            <option value="56">56</option>
            <option value="57">57</option>
            <option value="58">58</option>
            <option value="59">59</option>
          </select>
        </div>

        <div class="modal-actions">
          <button class="primary-button" type="button">Guardar</button>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
